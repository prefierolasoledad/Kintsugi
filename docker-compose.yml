# The whole stack, in one `docker compose up`.
#
# A distinct shape worth noticing: `migrate` is a one-shot job
# that runs to completion and exits, and `api` will not start until it has.
# Folding migrations into the API's own startup is the usual shortcut and it
# breaks the moment there is more than one replica — several containers racing
# `migrate deploy` against one database. A job that runs once maps directly onto
# a Kubernetes Job, which is where this is going next.
#
#   docker compose up --build          the stack
#   docker compose run --rm seed       seed the catalogue (one-shot, on demand)
#   docker compose --profile ha up -d  add a streaming standby
#   docker compose down -v             stop and delete the data volumes

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kintsugi
      POSTGRES_PASSWORD: kintsugi
      POSTGRES_DB: kintsugi
      # Read by primary-init.sh. A role that may stream WAL and do nothing else
      # — not the application account, and not a superuser.
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator}
    ports:
      # host 5433, not the default 5432 -- avoids clashing with a native
      # Postgres install already listening on 5432. Container-to-container
      # traffic uses 5432 regardless; this mapping is only for tools on the
      # host, like `npm test` or Prisma Studio.
      - "5433:5432"
    volumes:
      - kintsugi-postgres:/var/lib/postgresql/data
      # Runs once, on a database being initialised for the first time. An
      # existing volume never triggers this directory, which is why the script
      # is idempotent and can be run by hand — see the comment at its top.
      - ./docker/postgres/primary-init.sh:/docker-entrypoint-initdb.d/primary-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kintsugi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  # A streaming standby. Behind a profile, so it is opt-in.
  #
  #   docker compose --profile ha up -d postgres-replica
  #
  # WHAT THIS IS FOR, AND WHAT IT IS NOT
  # Availability: if the primary's machine dies, a byte-for-byte copy exists
  # that is seconds behind rather than a nightly backup behind.
  #
  # It is NOT a backup. Replication copies everything faithfully and in
  # milliseconds, `DROP TABLE orders` included — that is it working correctly.
  # Surviving a mistake needs WAL archiving and point-in-time recovery, which
  # is separate work.
  #
  # NOTHING READS FROM IT. The application still sends every query to the
  # primary. Routing reads here would introduce read-your-writes bugs — a buyer
  # completing checkout and being shown an order list that has not replayed
  # their order yet — and the caching in ADR 0019 already absorbed the read
  # volume a replica would have relieved. The replica is here to be promoted,
  # not queried.
  # ------------------------------------------------------------------
  postgres-replica:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: [ha]
    environment:
      PRIMARY_HOST: postgres
      PRIMARY_PORT: 5432
      POSTGRES_REPLICATION_USER: replicator
      # pg_basebackup reads PGPASSWORD; there is no other way to give it one
      # non-interactively.
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator}
      REPLICATION_SLOT: standby1
      # A SUBDIRECTORY of the mount, not the mount itself. pg_basebackup
      # refuses a non-empty target, and a volume mount point is not reliably
      # empty — one lost+found is enough to fail the clone.
      PGDATA: /var/lib/postgresql/data/pgdata
    # `sh script`, not the script directly. Git records the executable bit, but
    # a clone on Windows or under a restrictive umask can arrive without it, and
    # an entrypoint that is not executable fails with a bare "permission denied"
    # that says nothing about why. Invoking the interpreter does not care.
    entrypoint: ["sh", "/usr/local/bin/standby-entrypoint.sh"]
    volumes:
      - kintsugi-postgres-replica:/var/lib/postgresql/data
      - ./docker/postgres/standby-entrypoint.sh:/usr/local/bin/standby-entrypoint.sh:ro
    ports:
      # 5434, so the replication demo and psql can reach both ends from the host.
      - "5434:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # -U replicator would fail: that role cannot connect to a database, only
      # stream WAL. pg_isready only needs the server to answer.
      test: ["CMD-SHELL", "pg_isready -U kintsugi -d kintsugi"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Shared ephemeral state — rate-limit counters, and nothing else.
  #
  # NO VOLUME, deliberately. Nothing in here is allowed to matter after a
  # restart: losing the counters resets some windows early, which is a shrug.
  # Persisting them would invite treating Redis as a second source of truth,
  # and Postgres is the only one. See ADR 0018.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No AOF, no RDB. An ephemeral store that survives reboots is a lie waiting
    # to be relied on.
    command: redis-server --save "" --appendonly no
    ports:
      # Published for the load test and for redis-cli from the host.
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Runs the migration history and exits. `api` depends on it completing.
  migrate:
    build:
      context: ./backend
      # The build stage, not runtime: it is the only one carrying the Prisma
      # CLI, the schema, and prisma/migrations.
      target: build
    environment:
      DATABASE_URL: postgresql://kintsugi:kintsugi@postgres:5432/kintsugi
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma migrate deploy
    restart: "no"

  # Seed data. NOT part of `up` — deliberately opt-in, because it writes rows
  # and nobody wants that happening on every start.
  #   docker compose run --rm seed
  seed:
    build:
      context: ./backend
      target: build
    environment:
      DATABASE_URL: postgresql://kintsugi:kintsugi@postgres:5432/kintsugi
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma db seed
    profiles: [tools]
    restart: "no"

  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      # `postgres`, not localhost: inside the compose network a service name is
      # the hostname, and the port is the real 5432 rather than the host mapping.
      DATABASE_URL: postgresql://kintsugi:kintsugi@postgres:5432/kintsugi
      PORT: 4000
      # Where the browser reaches the frontend. Used for CORS and to build the
      # links that go into verification and password-reset emails.
      FRONTEND_ORIGIN: http://localhost:3000
      # Stubs by default so `up` works with no accounts and no keys. Override in
      # a .env beside this file to point at Stripe test mode.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stub}
      KYC_PROVIDER: ${KYC_PROVIDER:-stub}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # A dummy default, not a placeholder to fill in.
      #
      # /webhooks/stripe refuses to trust anything when this is unset — rightly,
      # since without it the endpoint is an unauthenticated "mark my order paid".
      # But the value is only ever an HMAC key: the test suite signs payloads
      # with it and the server verifies them, so any shared string exercises the
      # real verification path in stub mode. Override it with the value
      # `stripe listen` prints when pointing at Stripe test mode.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_compose_dummy_for_stub_mode}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-console}
      MAIL_FROM: ${MAIL_FROM:-Kintsugi <no-reply@kintsugi.local>}
      # Overridable, and it must be overridden anywhere real. A fixed default
      # here keeps sessions valid across restarts while developing.
      JWT_SECRET: ${JWT_SECRET:-compose-only-not-a-real-secret-000000}
      # `redis`, not localhost — a service name is the hostname inside the
      # compose network. Unset this to watch the limits come apart across
      # replicas, which is the point of the load test.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      # Published because the BROWSER loads seller photos from /uploads on this
      # origin. Without it every uploaded image 404s in the page even though the
      # frontend container can reach the API perfectly well.
      - "4000:4000"
    volumes:
      # Uploads outlive the container. Local disk is a known limitation — it is
      # not shared between replicas, which is what lib/storage.ts's seam exists
      # to fix later.
      - kintsugi-uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      # Server-to-server, inside the network. The browser never uses this.
      BACKEND_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  kintsugi-postgres:
  # Separate volume, obviously — a standby sharing the primary's data directory
  # is two servers writing to one set of files, which corrupts both.
  kintsugi-postgres-replica:
  kintsugi-uploads:
