# The whole stack, in one `docker compose up`.
#
# Every application image comes from the single ./Dockerfile, selected by
# `target:` — see the note at the top of it for why there is one file and not
# three.
#
# A distinct shape worth noticing: `migrate` is a one-shot job
# that runs to completion and exits, and `api` will not start until it has.
# Folding migrations into the API's own startup is the usual shortcut and it
# breaks the moment there is more than one replica — several containers racing
# `migrate deploy` against one database. A job that runs once maps directly onto
# a Kubernetes Job, which is where this is going next.
#
#   docker compose up --build              the stack
#   docker compose run --rm seed           seed the catalogue (one-shot, on demand)
#   docker compose --profile ha up -d      add a streaming standby
#   docker compose down -v                 stop and delete the data volumes

services:
  postgres:
    # Built rather than pulled: the official image has no S3 client, so there is
    # nothing for archive_command to run. See docker/postgres/Dockerfile.
    build:
      context: ./docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: kintsugi
      POSTGRES_PASSWORD: kintsugi
      POSTGRES_DB: kintsugi
      # Read by primary-init.sh. A role that may stream WAL and do nothing else
      # — not the application account, and not a superuser.
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator}
      # The ONLY configuration mc needs. MC_HOST_<alias> replaces `mc alias set`
      # entirely, so there is no config file to write into the data directory
      # and no credentials baked into the image. archive_command inherits this
      # because it runs as a child of the postgres process.
      MC_HOST_backups: http://${S3_ACCESS_KEY:-kintsugi}:${S3_SECRET_KEY:-kintsugi-dev-secret}@minio:9000
    ports:
      # host 5433, not the default 5432 -- avoids clashing with a native
      # Postgres install already listening on 5432. Container-to-container
      # traffic uses 5432 regardless; this mapping is only for tools on the
      # host, like `npm test` or Prisma Studio.
      - "5433:5432"
    volumes:
      - kintsugi-postgres:/var/lib/postgresql/data
      # Runs once, on a database being initialised for the first time. An
      # existing volume never triggers this directory, which is why the script
      # is idempotent and can be run by hand — see the comment at its top.
      - ./docker/postgres/primary-init.sh:/docker-entrypoint-initdb.d/primary-init.sh:ro

    # ----------------------------------------------------------------
    # WAL archiving, which is what makes point-in-time recovery possible.
    #
    # A REPLICA IS NOT A BACKUP. The standby (profile `ha`) copies a mistaken
    # `DROP TABLE orders` faithfully and in milliseconds — that is it working
    # correctly. Going back to a moment before the mistake needs the write-ahead
    # log kept somewhere the database itself cannot reach, which is this.
    #
    # `archive_mode` cannot be changed by a reload, only a restart, which is why
    # it is on the command line rather than in primary-init.sh.
    # ----------------------------------------------------------------
    command:
      - postgres
      - -c
      - archive_mode=on
      # `-q` so a successful copy is silent; Postgres logs failures itself, and
      # a line per WAL segment would bury everything else.
      #
      # THE EXIT CODE IS LOAD-BEARING. Postgres keeps a segment until this
      # command succeeds and retries forever if it fails — so a broken archive
      # fills the data directory rather than losing backups silently. That is
      # the right failure, and it is why this must never end in `|| true`.
      - -c
      - archive_command=mc -q cp %p backups/kintsugi-backups/wal/%f
      # Forces a segment switch once a minute even when idle. Without it a quiet
      # database archives nothing until 16MB has accumulated, so the recovery
      # point could be hours old.
      - -c
      - archive_timeout=60

    depends_on:
      # Archiving starts the moment Postgres does, and every attempt before the
      # bucket exists is a failed archive_command that Postgres retries. Waiting
      # costs a few seconds and removes a wall of errors from the log.
      minio:
        condition: service_healthy

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kintsugi"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------------------------------------------------
  # A streaming standby. Behind a profile, so it is opt-in.
  #
  #   docker compose --profile ha up -d postgres-replica
  #
  # WHAT THIS IS FOR, AND WHAT IT IS NOT
  # Availability: if the primary's machine dies, a byte-for-byte copy exists
  # that is seconds behind rather than a nightly backup behind.
  #
  # It is NOT a backup. Replication copies everything faithfully and in
  # milliseconds, `DROP TABLE orders` included — that is it working correctly.
  # Surviving a mistake needs WAL archiving and point-in-time recovery, which
  # is separate work.
  #
  # NOTHING READS FROM IT. The application still sends every query to the
  # primary. Routing reads here would introduce read-your-writes bugs — a buyer
  # completing checkout and being shown an order list that has not replayed
  # their order yet — and the caching in ADR 0019 already absorbed the read
  # volume a replica would have relieved. The replica is here to be promoted,
  # not queried.
  # ------------------------------------------------------------------
  postgres-replica:
    image: postgres:16-alpine
    restart: unless-stopped
    profiles: [ha]
    environment:
      PRIMARY_HOST: postgres
      PRIMARY_PORT: 5432
      POSTGRES_REPLICATION_USER: replicator
      # pg_basebackup reads PGPASSWORD; there is no other way to give it one
      # non-interactively.
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator}
      REPLICATION_SLOT: standby1
      # A SUBDIRECTORY of the mount, not the mount itself. pg_basebackup
      # refuses a non-empty target, and a volume mount point is not reliably
      # empty — one lost+found is enough to fail the clone.
      PGDATA: /var/lib/postgresql/data/pgdata
    # `sh script`, not the script directly. Git records the executable bit, but
    # a clone on Windows or under a restrictive umask can arrive without it, and
    # an entrypoint that is not executable fails with a bare "permission denied"
    # that says nothing about why. Invoking the interpreter does not care.
    entrypoint: ["sh", "/usr/local/bin/standby-entrypoint.sh"]
    volumes:
      - kintsugi-postgres-replica:/var/lib/postgresql/data
      - ./docker/postgres/standby-entrypoint.sh:/usr/local/bin/standby-entrypoint.sh:ro
    ports:
      # 5434, so the replication demo and psql can reach both ends from the host.
      - "5434:5432"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # -U replicator would fail: that role cannot connect to a database, only
      # stream WAL. pg_isready only needs the server to answer.
      test: ["CMD-SHELL", "pg_isready -U kintsugi -d kintsugi"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Shared ephemeral state — rate-limit counters, and nothing else.
  #
  # NO VOLUME, deliberately. Nothing in here is allowed to matter after a
  # restart: losing the counters resets some windows early, which is a shrug.
  # Persisting them would invite treating Redis as a second source of truth,
  # and Postgres is the only one. See ADR 0018.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    # No AOF, no RDB. An ephemeral store that survives reboots is a lie waiting
    # to be relied on.
    command: redis-server --save "" --appendonly no
    ports:
      # Published for the load test and for redis-cli from the host.
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ------------------------------------------------------------------
  # Object storage for uploaded photos.
  #
  # S3-compatible, so the same code runs against S3, R2 or Spaces with only an
  # endpoint change. Local disk is what stopped the API from having more than
  # one replica — two containers with separate disks serve different sets of
  # photos, so an image loads or 404s depending on which one answered.
  #
  # It also fixes seller photos under Compose at all: they used to be loaded
  # from localhost:4000, which the host can reach and the web container cannot.
  # ------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-kintsugi}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-kintsugi-dev-secret}
    ports:
      # 9000 is the S3 API — published because the BROWSER loads photos from it
      # directly, exactly as it would from a CDN.
      - "9000:9000"
      # 9001 is the web console, for looking at what actually got written.
      - "9001:9001"
    volumes:
      - kintsugi-minio:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Creates the bucket and grants anonymous GetObject — not `mc anonymous set
  # download`, which also grants ListBucket to everyone and would make every
  # photo and avatar on the platform enumerable from a browser. See the script.
  #
  # PUBLIC READ ON OBJECTS IS CORRECT HERE: these are listing photos and avatars
  # on a public marketplace, already visible to anyone who can load a product
  # page, and serving them unsigned is what lets a CDN cache them at all. Keys
  # are 128 bits of randomness, so unguessable — which only holds while the
  # bucket cannot be listed.
  #
  # Anything genuinely private must NOT go in this bucket.
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_BUCKET: ${S3_BUCKET:-kintsugi-uploads}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-kintsugi-backups}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kintsugi}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kintsugi-dev-secret}
    entrypoint: ["sh", "/usr/local/bin/minio-init.sh"]
    volumes:
      - ./docker/minio/minio-init.sh:/usr/local/bin/minio-init.sh:ro
    restart: "no"

  # ------------------------------------------------------------------
  # A base backup, on demand. WAL archiving alone restores nothing — recovery
  # replays the log ONTO a copy, so the oldest recoverable moment is the oldest
  # base backup still held, not the oldest WAL segment.
  #
  #   docker compose run --rm base-backup
  #
  # Not scheduled here. Compose has no scheduler and inventing one with a sleep
  # loop would be a worse cron than cron. In Kubernetes this is a CronJob, and
  # CloudNativePG expresses it as a `ScheduledBackup`.
  # ------------------------------------------------------------------
  base-backup:
    # Same image as the primary — it already has pg_basebackup and mc.
    build:
      context: ./docker/postgres
    profiles: [tools]
    environment:
      PRIMARY_HOST: postgres
      PRIMARY_PORT: 5432
      POSTGRES_REPLICATION_USER: replicator
      PGPASSWORD: ${POSTGRES_REPLICATION_PASSWORD:-replicator}
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-kintsugi-backups}
      MC_HOST_backups: http://${S3_ACCESS_KEY:-kintsugi}:${S3_SECRET_KEY:-kintsugi-dev-secret}@minio:9000
    entrypoint: ["sh", "/usr/local/bin/base-backup.sh"]
    volumes:
      - ./docker/postgres/base-backup.sh:/usr/local/bin/base-backup.sh:ro
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: "no"

  # ------------------------------------------------------------------
  # Point-in-time recovery, into a SECOND database on port 5435.
  #
  #   RECOVERY_TARGET_TIME='2026-09-03 08:40:00+00'   #     docker compose --profile tools up -d restore
  #
  # Not over the live one, deliberately: a rehearsal that causes an outage is a
  # rehearsal nobody performs. This comes up as an ordinary database that
  # happens to hold the past, so the result can be queried and compared.
  #
  # The real incident procedure is the same script pointed at the primary's
  # data directory.
  # ------------------------------------------------------------------
  restore:
    build:
      context: ./docker/postgres
    profiles: [tools]
    environment:
      # A SUBDIRECTORY of the mount: restore.sh wipes PGDATA before unpacking,
      # and a volume mount point is not reliably empty.
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: kintsugi
      POSTGRES_PASSWORD: kintsugi
      POSTGRES_DB: kintsugi
      S3_BACKUP_BUCKET: ${S3_BACKUP_BUCKET:-kintsugi-backups}
      RECOVERY_TARGET_TIME: ${RECOVERY_TARGET_TIME:-}
      MC_HOST_backups: http://${S3_ACCESS_KEY:-kintsugi}:${S3_SECRET_KEY:-kintsugi-dev-secret}@minio:9000
    entrypoint: ["sh", "/usr/local/bin/restore.sh"]
    volumes:
      - ./docker/postgres/restore.sh:/usr/local/bin/restore.sh:ro
      # NOT a named volume. Every drill must start from nothing — a leftover
      # data directory would be restored *over*, and a stale one that happened
      # to start would look like a successful recovery of the wrong instant.
      - type: tmpfs
        target: /var/lib/postgresql/data
    ports:
      - "5435:5432"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  # Runs the migration history and exits. `api` depends on it completing.
  migrate:
    build:
      context: .
      # The build stage, not a runtime one: it is the only target carrying the
      # Prisma CLI, the schema, and prisma/migrations.
      target: api-build
    environment:
      DATABASE_URL: postgresql://kintsugi:kintsugi@postgres:5432/kintsugi
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma migrate deploy
    restart: "no"

  # Seed data. NOT part of `up` — deliberately opt-in, because it writes rows
  # and nobody wants that happening on every start.
  #   docker compose run --rm seed
  seed:
    build:
      context: .
      target: api-build
    environment:
      DATABASE_URL: postgresql://kintsugi:kintsugi@postgres:5432/kintsugi
    depends_on:
      postgres:
        condition: service_healthy
    command: npx prisma db seed
    profiles: [tools]
    restart: "no"

  api:
    build:
      context: .
      target: api
    restart: unless-stopped
    environment:
      # `postgres`, not localhost: inside the compose network a service name is
      # the hostname, and the port is the real 5432 rather than the host mapping.
      DATABASE_URL: postgresql://kintsugi:kintsugi@postgres:5432/kintsugi
      PORT: 4000
      # Where the browser reaches the frontend. Used for CORS and to build the
      # links that go into verification and password-reset emails.
      FRONTEND_ORIGIN: http://localhost:3000
      # Stubs by default so `up` works with no accounts and no keys. Override in
      # a .env beside this file to point at Stripe test mode.
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stub}
      KYC_PROVIDER: ${KYC_PROVIDER:-stub}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      # A dummy default, not a placeholder to fill in.
      #
      # /webhooks/stripe refuses to trust anything when this is unset — rightly,
      # since without it the endpoint is an unauthenticated "mark my order paid".
      # But the value is only ever an HMAC key: the test suite signs payloads
      # with it and the server verifies them, so any shared string exercises the
      # real verification path in stub mode. Override it with the value
      # `stripe listen` prints when pointing at Stripe test mode.
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_compose_dummy_for_stub_mode}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-console}
      MAIL_FROM: ${MAIL_FROM:-Kintsugi <no-reply@kintsugi.local>}
      # Overridable, and it must be overridden anywhere real. A fixed default
      # here keeps sessions valid across restarts while developing.
      JWT_SECRET: ${JWT_SECRET:-compose-only-not-a-real-secret-000000}
      # `redis`, not localhost — a service name is the hostname inside the
      # compose network. Unset this to watch the limits come apart across
      # replicas, which is the point of the load test.
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      # Object storage, not local disk. This is what makes the API replicable:
      # every replica reads and writes the same bucket.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-s3}
      # `minio`, because this is the SERVER talking. Container-network only.
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-kintsugi-uploads}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-kintsugi}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-kintsugi-dev-secret}
      # `localhost`, because this is the BROWSER'S address for the same bucket.
      # Two different URLs for one store, and conflating them is the bug this
      # whole change exists to fix — the upload succeeds and the page shows a
      # broken image, because `http://minio:9000` means nothing outside Docker.
      S3_PUBLIC_BASE: ${S3_PUBLIC_BASE:-http://localhost:9000/${S3_BUCKET:-kintsugi-uploads}}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    environment:
      # Server-to-server, inside the network. The browser never uses this.
      BACKEND_URL: http://api:4000
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  kintsugi-postgres:
  kintsugi-minio:
  # Separate volume, obviously — a standby sharing the primary's data directory
  # is two servers writing to one set of files, which corrupts both.
  kintsugi-postgres-replica:
